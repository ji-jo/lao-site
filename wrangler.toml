name = "lao-waitlist"
compatibility_date = "2024-03-20"
pages_build_output_dir = "./dist"

[vars]
PUBLIC_SITE_URL = "https://lao.lt"
WAITLIST_FROM_EMAIL = "LAO <waitlist@lao.lt>"

